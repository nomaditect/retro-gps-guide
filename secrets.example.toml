# Copy to secrets.toml (gitignored) before running install.sh; it ends up in /etc/retrogps/.

# Wi-Fi networks to join, best first. 2.4 GHz only: on an iPhone turn on
# Settings > Personal Hotspot > Maximise Compatibility.
[[wifi]]
ssid = "Your iPhone"
password = "hotspot-password"

[[wifi]]
ssid = "home-wifi"
password = "home-password"

[keys]
# Coffee, food, things to do. Free key from https://myprojects.geoapify.com
# (leave empty to use OpenStreetMap's Overpass servers: free, but often busy).
geoapify = ""
# Much better Wi-Fi positioning than BeaconDB, which can be 25 km out on mobile data.
google_geo = ""

[github]
# Optional: upload trip.geojson after every update (GitHub draws it as a map).
# A fine-grained token with "Contents: read and write" on just this one repo.
token = ""
repo = "your-name/canada-trip"
